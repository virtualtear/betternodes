<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>betternodes demo</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#fff, #09090b);
      --panel: light-dark(#fafafa, #0f0f11);
      --line: light-dark(rgb(24 24 27 / 0.08), rgb(255 255 255 / 0.08));
      --text: light-dark(#18181b, #fafafa);
      --muted: light-dark(#71717a, #a1a1aa);
      --button: light-dark(#fff, #18181b);
      --button-hover: light-dark(#f4f4f5, #27272a);
      --accent: light-dark(#4f46e5, #818cf8);
      --ok: #10b981;
      --error: #f43f5e;
      --busy: #f59e0b;
    }
    :root.dark { color-scheme: dark; }
    :root.light { color-scheme: light; }
    body {
      margin: 0; height: 100dvh; display: flex; flex-direction: column;
      background: var(--page); color: var(--text);
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .tools { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
    button {
      font: inherit; font-weight: 500; color: var(--text);
      padding: 5px 11px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
      transition: background-color 120ms ease-out, box-shadow 120ms ease-out;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) { button:hover { background: var(--button-hover); } }
    button:active { scale: 0.97; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button[aria-pressed='true'] { background: var(--button); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(24 24 27 / 0.08); }
    #run[aria-pressed='true'] { color: var(--accent); }
    input[type='number'] {
      width: 7ch; margin: 0; padding: 4px 6px; border: 0; border-radius: 8px;
      font: inherit; font-variant-numeric: tabular-nums; color: var(--text);
      background: var(--button); box-shadow: inset 0 0 0 1px var(--line);
    }
    input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .hint { flex: 1 1 320px; margin: 0; color: var(--muted); font-size: 12px; }
    .hint code { white-space: nowrap; }
    /* Touch screens: the keyboard hints don't apply, and the graph needs the room. */
    @media (max-width: 640px) { .hint { display: none; } #events { height: 120px; } }
    kbd { padding: 1px 5px; border-radius: 5px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font: 11px ui-monospace, monospace; }
    .meta { display: flex; gap: 12px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #selection:not(:empty) { color: var(--accent); font-weight: 500; }
    #app { flex: 1; min-height: 0; }
    /* Demo-only status styling for nodes tagged with .class(): a dot before the title, and for
       errors a tinted ring through the theme variable, so hover and drag shadows still apply. */
    .bn-node:is(.ok, .error, .busy) .bn-title::before {
      content: ''; display: inline-block; width: 7px; height: 7px; margin: 0 8px 1px 0; border-radius: 50%;
      background: var(--status); box-shadow: 0 0 0 3px color-mix(in srgb, var(--status) 18%, transparent);
    }
    .bn-node.ok { --status: var(--ok); }
    .bn-node.busy { --status: var(--busy); }
    .bn-node.busy .bn-title::before { animation: pulse 1s ease-in-out infinite alternate; }
    .bn-node.error { --status: var(--error); --bn-node-border: color-mix(in srgb, var(--error) 45%, transparent); --bn-node-hover: var(--error); }
    .bn-mini-node.ok { fill: color-mix(in srgb, var(--ok) 60%, var(--bn-minimap-node)); }
    .bn-mini-node.error { fill: var(--error); }
    @keyframes pulse { to { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .bn-node.busy .bn-title::before { animation: none; } }
    .bn-node.photo { cursor: pointer; }
    .photo-card { padding: 0 14px 12px; }
    .photo-card img { display: block; border-radius: 8px; background: var(--bn-grid); }
    .photo-card p { margin: 8px 0 0; color: var(--bn-text-muted); font-size: 12px; }
    .bn-packet.photo-packet { fill: #0ea5e9; }
    #events { height: 168px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--panel); }
    #events-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 14px; color: var(--muted); font-size: 12px; font-weight: 600; }
    #log { flex: 1; overflow: auto; margin: 0; padding: 0 14px 8px; list-style: none; font: 12px/1.7 ui-monospace, monospace; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    #log time { color: var(--muted); }
    #log b { display: inline-block; width: 9ch; margin-left: 1.5ch; font-weight: 600; }
    #log .change { color: var(--ok); }
    #log .select, #log .click, #log .dblclick { color: var(--accent); }
    #log .send { color: #0ea5e9; }
  </style>
</head>
<body>
  <header>
    <div class="tools" role="group" aria-label="Mode">
      <button id="view" aria-pressed="true">View</button>
      <button id="edit" aria-pressed="false">Edit</button>
    </div>
    <div class="tools">
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
    </div>
    <div class="tools">
      <button id="send">Send</button>
      <button id="run" aria-pressed="false">Run</button>
    </div>
    <form class="tools" id="burst" title="Floods the graph from its first node this many times at once, at mixed speeds">
      <input id="burst-count" type="number" min="1" max="100000" value="1000" aria-label="Packets per burst">
      <button>Burst</button>
    </form>
    <div class="tools">
      <button id="layout">Layout</button>
      <button id="fit">Fit</button>
      <button id="theme" aria-pressed="false">Dark</button>
      <button id="reset">Reset</button>
    </div>
    <p class="hint">Edit mode: click a wire or node, <kbd>Shift</kbd>+click or <kbd>Shift</kbd>+drag for more, then <kbd>Delete</kbd>. Drag to an edge to scroll. <kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>. <code>?n=1000</code> for a stress test.</p>
    <div class="meta">
      <output id="selection"></output>
      <output id="fps" title="Frames per second over the last half second, and the slowest frame in it">- fps</output>
    </div>
  </header>
  <div id="app"></div>
  <div id="events">
    <div id="events-bar">Events <button id="clear">Clear</button></div>
    <ol id="log"></ol>
  </div>
  <script type="module">
    import { flow } from '/src/index.ts'

    const n = Number(new URLSearchParams(location.search).get('n'))
    const key = `betternodes-demo-v4-${n || 'sample'}`
    const f = flow(document.getElementById('app'), { minimap: true })

    // Event console, newest line on top, capped at 200 lines.
    const log = document.getElementById('log')
    const write = (type, text) => {
      const time = document.createElement('time')
      time.textContent = new Date().toTimeString().slice(0, 8)
      const name = document.createElement('b')
      name.className = type
      name.textContent = type
      const line = document.createElement('li')
      line.append(time, name, text)
      log.prepend(line)
      log.children[200]?.remove()
    }
    document.getElementById('clear').onclick = () => log.replaceChildren()

    if (n) {
      // Grid of n nodes, each wired to its right-hand neighbour.
      const cols = Math.ceil(Math.sqrt(n))
      for (let i = 0; i < n; i++) {
        f.node(`n${i}`).title(`Node ${i}`).at((i % cols) * 240, Math.floor(i / cols) * 120)
        if (i % cols) f.connect(`n${i - 1}.e`, `n${i}.w`)
      }
    } else {
      const note = document.createElement('p')
      note.style.cssText = 'margin: 0; padding: 0 14px 12px; color: var(--bn-text-muted); font-size: 12px; max-width: 180px'
      note.textContent = 'Custom content: any element, from any framework.'

      // No at(): auto-layout places these. Bare ids make floating wire ends.
      f.node('hook').title('Webhook').class('ok')
      f.node('if').title('IF').class('ok')
      f.node('mail').title('Send mail').content(note).class('error')
      f.node('log').title('Log')
      f.connect('hook', 'if').connect('if', 'mail', { label: 'true' }).connect('if', 'log', { label: 'false' })
      f.group('output').title('Output').nodes('mail', 'log')

      // Image service: custom content that changes at runtime. Clicking the node swaps in another
      // photo. Photos differ in size on purpose: the node resizes, its wires re-route, and a
      // neighbour it grows into moves aside.
      const photo = (id, w, h) => ({ src: `https://picsum.photos/id/${id}/${w}/${h}`, w, h })
      const photos = [photo(1025, 200, 140), photo(1015, 240, 120), photo(1043, 160, 200), photo(1069, 200, 200), photo(237, 220, 150)]
      const img = document.createElement('img')
      img.draggable = false // a native image drag would cancel the pan or node drag
      const caption = document.createElement('p')
      const card = document.createElement('div')
      card.className = 'photo-card'
      card.append(img, caption)

      let shown = -1
      let swapped = false
      const show = i => {
        shown = i
        Object.assign(img, { src: photos[i].src, width: photos[i].w, height: photos[i].h, alt: `Photo ${i + 1}` })
        caption.textContent = `Photo ${i + 1} of ${photos.length}. Click to swap.`
        f.node('image').class('photo', 'busy')
      }
      img.onload = () => {
        f.node('image').class('photo', 'ok')
        // Once a swapped-in photo is in, a packet carries it downstream.
        if (swapped) f.send('image', undefined, { class: 'photo-packet' }).then(reached => write('send', `image reached ${JSON.stringify(reached)}`))
      }
      img.onerror = () => f.node('image').class('photo', 'error')

      f.node('image').title('Image service').content(card)
      show(0)
      // A fixed end on the image node's east side; the log end stays floating.
      f.connect('hook', 'image', { label: 'photo' }).connect('image.e', 'log')

      // Flow clicks never follow a drag. Shift+click and anchor presses belong to the editor.
      f.on('click', ({ node }, e) => {
        if (node !== 'image' || e.shiftKey || e.target.closest('.bn-anchor')) return
        // Any photo but the one shown.
        swapped = true
        show((shown + 1 + Math.floor(Math.random() * (photos.length - 1))) % photos.length)
      })
    }

    f.load(JSON.parse(localStorage.getItem(key) ?? 'null'))
    f.on('change', () => localStorage.setItem(key, JSON.stringify(f.state())))
    const selection = document.getElementById('selection')
    f.on('select', ({ nodes, wire }) => {
      selection.textContent = wire ? `wire ${wire.join(' → ')}` : nodes.length ? `${nodes.length} selected` : ''
    })
    // Empty diff fields are left out, so each line shows only what the edit did.
    const compact = diff => Object.fromEntries(Object.entries(diff).filter(([, v]) => Object.keys(v).length))
    f.on('change', diff => write('change', JSON.stringify(compact(diff))))
    f.on('select', selection => write('select', JSON.stringify(selection)))
    for (const type of ['click', 'dblclick']) f.on(type, hit => write(type, JSON.stringify(hit)))

    for (const mode of ['view', 'edit']) document.getElementById(mode).onclick = () => {
      f.mode(mode)
      for (const other of ['view', 'edit']) document.getElementById(other).setAttribute('aria-pressed', String(other === mode))
    }
    // The page follows the system theme until toggled; the graph follows the page.
    const app = document.getElementById('app')
    const theme = document.getElementById('theme')
    const paint = dark => {
      document.documentElement.classList.toggle('dark', dark)
      document.documentElement.classList.toggle('light', !dark)
      app.classList.toggle('bn-dark', dark)
      theme.setAttribute('aria-pressed', String(dark))
    }
    paint(matchMedia('(prefers-color-scheme: dark)').matches)
    theme.onclick = () => paint(theme.getAttribute('aria-pressed') !== 'true')
    // Packets: Send floods the graph once from its first node, Run keeps sending every second.
    window.f = f
    const first = n ? 'n0' : 'hook'
    document.getElementById('send').onclick = () => f.send(first).then(reached => write('send', `${first} reached ${JSON.stringify(reached)}`))
    let timer = 0
    document.getElementById('run').onclick = e => {
      if (timer) {
        clearInterval(timer)
        timer = 0
      } else timer = setInterval(() => f.send(first), 1000)
      e.target.setAttribute('aria-pressed', String(!!timer))
      e.target.textContent = timer ? 'Stop' : 'Run'
    }
    // Burst: many sends in one task, to check the frame rate holds while they travel.
    document.getElementById('burst').onsubmit = e => {
      e.preventDefault()
      const count = document.getElementById('burst-count').valueAsNumber
      if (!(count >= 1)) return
      const start = performance.now()
      // Mixed speeds spread the packets along the wires; at one speed they would overlap as one dot.
      const sends = Array.from({ length: count }, () => f.send(first, undefined, { speed: 120 + Math.random() * 360 }))
      write('send', `burst of ${count} started in ${Math.round(performance.now() - start)} ms`)
      Promise.all(sends).then(() => write('send', `burst of ${count} arrived after ${((performance.now() - start) / 1000).toFixed(1)} s`))
    }
    document.getElementById('undo').onclick = () => f.undo()
    document.getElementById('redo').onclick = () => f.redo()
    // layout() emits no change event, so persist the new positions here.
    document.getElementById('layout').onclick = () => localStorage.setItem(key, JSON.stringify(f.layout().fit().state()))
    document.getElementById('fit').onclick = () => f.fit()

    // Frame rate the browser actually delivers, plus the slowest frame, so a single hitch shows too.
    const fps = document.getElementById('fps')
    let [frames, since, prev, slowest] = [0, performance.now(), performance.now(), 0]
    requestAnimationFrame(function tick(now) {
      frames++
      slowest = Math.max(slowest, now - prev)
      prev = now
      if (now - since >= 500) {
        fps.textContent = `${Math.round((frames * 1000) / (now - since))} fps, slowest ${Math.round(slowest)} ms`
        ;[frames, since, slowest] = [0, now, 0]
      }
      requestAnimationFrame(tick)
    })
    document.getElementById('reset').onclick = () => {
      localStorage.removeItem(key)
      location.reload()
    }
  </script>
</body>
</html>
